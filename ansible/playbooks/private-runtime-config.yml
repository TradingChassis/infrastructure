---
# Explicit opt-in playbook for private deployment configuration.
# This playbook is intentionally not part of site.yml.
#
# Operator handoff (private values stay outside Git):
#   VAULT_ID   → private_runtime_config_vault_id
#   OCI_REGION → private_runtime_config_oci_region
#
# Fresh V2 clean-room sequence:
#   1. site.yml (MicroK8s + Argo CD + root Application)
#   2. private-runtime-config.yml
# The role performs bounded, condition-based waits for the OCI secrets
# platform (SPC CRD, CSIDriver, CSI Driver DaemonSet, OCI provider DaemonSet)
# and for Argo-created application namespaces before any mutation.
# Operators do not need to guess sleep timing.
#
# Active GitOps shims select overlays/v2 (no Git-owned SPCs). This playbook
# is the sole owner of the three runtime SecretProviderClass resources and
# tradingchassis-runtime-config after it runs.
#
# Do not execute this playbook against a cluster that still treats historical
# V1 overlays as the active desired state for the same SPC identities.
#
# Ownership invariant:
# At no steady-state point may Argo CD and Ansible both be authoritative
# for the same SecretProviderClass resources.
- name: Materialize private runtime configuration
  hosts: tradingchassis
  gather_facts: false
  roles:
    - role: private_runtime_config
