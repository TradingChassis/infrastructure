---
- name: Ensure dedicated Kubernetes Ansible module runtime
  ansible.builtin.import_role:
    name: ansible_k8s_runtime

- name: Assert Helm timeout is a Helm 3 duration
  ansible.builtin.assert:
    that:
      - argocd_bootstrap_helm_timeout is string
      - argocd_bootstrap_helm_timeout is match('^[1-9][0-9]*[smh]$')
      - argocd_bootstrap_k8s_wait_timeout is number
      - (argocd_bootstrap_k8s_wait_timeout | int) > 0
    fail_msg: >-
      argocd_bootstrap_helm_timeout must be a Helm 3 duration such as 10m or 600s,
      never a bare integer. kubernetes.core.k8s wait_timeout remains seconds as an int.
    success_msg: Argo CD Helm timeout is a Helm 3 duration and k8s wait_timeout is an int.

- name: Reconcile Argo CD with the dedicated Kubernetes module runtime
  vars:
    ansible_python_interpreter: "{{ ansible_k8s_runtime_python }}"
  block:
    - name: Ensure Argo CD namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ argocd_bootstrap_namespace }}"
        state: present
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
      become: true

    - name: Install Argo CD Helm release
      kubernetes.core.helm:
        name: "{{ argocd_bootstrap_release_name }}"
        chart_ref: "{{ argocd_bootstrap_chart_name }}"
        chart_repo_url: "{{ argocd_bootstrap_chart_repo_url }}"
        chart_version: "{{ argocd_bootstrap_chart_version }}"
        release_namespace: "{{ argocd_bootstrap_namespace }}"
        create_namespace: true
        binary_path: "{{ argocd_bootstrap_helm_binary }}"
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
        wait: true
        timeout: "{{ argocd_bootstrap_helm_timeout }}"
        values:
          global:
            image:
              tag: "{{ argocd_bootstrap_app_version }}"
          configs:
            cm:
              kustomize.buildOptions: "--enable-helm"
      become: true

    - name: Wait for Argo CD server deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ argocd_bootstrap_release_name }}-server"
        namespace: "{{ argocd_bootstrap_namespace }}"
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
        wait: true
        wait_timeout: "{{ argocd_bootstrap_k8s_wait_timeout | int }}"
        wait_condition:
          type: Available
          status: "True"
      become: true

    - name: Wait for Argo CD repo-server deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ argocd_bootstrap_release_name }}-repo-server"
        namespace: "{{ argocd_bootstrap_namespace }}"
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
        wait: true
        wait_timeout: "{{ argocd_bootstrap_k8s_wait_timeout | int }}"
        wait_condition:
          type: Available
          status: "True"
      become: true

    - name: Wait for Argo CD application-controller
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ argocd_bootstrap_release_name }}-application-controller"
        namespace: "{{ argocd_bootstrap_namespace }}"
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
        wait: true
        wait_timeout: "{{ argocd_bootstrap_k8s_wait_timeout | int }}"
      become: true

    - name: Apply GitOps root Application
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"
        definition: >-
          {{
            lookup(
              'ansible.builtin.file',
              (playbook_dir | dirname | dirname) ~ '/argocd/root-app.yaml'
            ) | from_yaml
          }}
      become: true
