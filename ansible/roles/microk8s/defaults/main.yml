---
# Preserve the V1 Kubernetes release line for this migration scope.
microk8s_channel: 1.29/stable

# Core addons required by the V1 bootstrap intent.
# Canonical documents `helm` as installing Helm 3; `helm3` is a transition alias.
microk8s_addons:
  - dns
  - hostpath-storage
  - metrics-server
  - helm

# Host firewall (UFW) policy for the single-node reference host.
# Remote SSH source restriction remains the OCI NSG responsibility.
microk8s_firewall_ssh_port: "22"

# Canonical MicroK8s 1.29/stable Calico pod CIDR. This is the Kubernetes
# pod network, not a live-discovered address and not the cluster Service CIDR.
microk8s_pod_cidr: "10.1.0.0/16"

# MicroK8s kube-apiserver secure port. Not opened on UFW or OCI NSGs for
# the Internet. nft INPUT allows this port only from microk8s_pod_cidr.
microk8s_apiserver_port: "16443"

# MicroK8s kubelet/kubelite port. Not opened on UFW or OCI NSGs for the
# Internet. nft INPUT allows this port only from microk8s_pod_cidr so
# metrics-server can scrape node-local kubelet.
microk8s_kubelet_port: "10250"
