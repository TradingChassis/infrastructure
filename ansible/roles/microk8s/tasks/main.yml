---
- name: Ensure snapd is installed
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure UFW package is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure snapd service is enabled and started
  ansible.builtin.service:
    name: snapd
    state: started
    enabled: true
  become: true

# OCI Ubuntu cloud images persist an unconditional IPv4 FORWARD REJECT in
# /etc/iptables/rules.v4. That rule is loaded into the nft-compatible table
# ahead of UFW and MicroK8s/Calico ACCEPT rules and blocks Pod → Service
# traffic. Normalize only that exact rule before MicroK8s installation.
- name: Copy OCI FORWARD REJECT normalization helper
  ansible.builtin.copy:
    src: normalize_oci_forward_reject.py
    dest: /tmp/tradingchassis-normalize-oci-forward-reject.py
    mode: "0600"
  become: true

- name: Normalize persistent OCI cloud-image IPv4 FORWARD REJECT
  ansible.builtin.command:
    argv:
      - python3
      - /tmp/tradingchassis-normalize-oci-forward-reject.py
      - --rules-file
      - /etc/iptables/rules.v4
  register: oci_forward_reject_file
  become: true
  changed_when: (oci_forward_reject_file.stdout | trim) == "removed"
  failed_when: oci_forward_reject_file.rc != 0

- name: Stat iptables-nft for runtime FORWARD normalization
  ansible.builtin.stat:
    path: /usr/sbin/iptables-nft
  register: oci_iptables_nft_stat

- name: Assert iptables-nft is present for runtime FORWARD normalization
  ansible.builtin.assert:
    that:
      - oci_iptables_nft_stat.stat.exists
    fail_msg: >-
      /usr/sbin/iptables-nft is required to remove the OCI cloud-image
      unconditional FORWARD REJECT from the nft-compatible table. The
      supported Ubuntu 24 OCI reference host provides iptables-nft.
      iptables-legacy Kubernetes rules are not modified.
    success_msg: iptables-nft is present for semantic FORWARD rule deletion.

# Use the nft-compatible binary by absolute path. Ansible iptables modules
# follow PATH and can target iptables-legacy, which holds Calico/kube-proxy
# rules on the OCI Ubuntu host and must not be mutated here.
- name: Check nft-compatible unconditional IPv4 FORWARD REJECT
  ansible.builtin.command:
    argv:
      - /usr/sbin/iptables-nft
      - -C
      - FORWARD
      - -j
      - REJECT
      - --reject-with
      - icmp-host-prohibited
  register: oci_forward_reject_check
  become: true
  changed_when: false
  failed_when: oci_forward_reject_check.rc not in [0, 1]

- name: Delete nft-compatible unconditional IPv4 FORWARD REJECT when present
  when: oci_forward_reject_check.rc == 0
  ansible.builtin.command:
    argv:
      - /usr/sbin/iptables-nft
      - -D
      - FORWARD
      - -j
      - REJECT
      - --reject-with
      - icmp-host-prohibited
  become: true
  register: oci_forward_reject_delete
  changed_when: oci_forward_reject_delete.rc == 0
  failed_when: oci_forward_reject_delete.rc != 0

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true

- name: Set UFW default routed policy to allow for MicroK8s CNI
  community.general.ufw:
    direction: routed
    policy: allow
  become: true

- name: Allow SSH on the host firewall
  community.general.ufw:
    rule: allow
    port: "{{ microk8s_firewall_ssh_port }}"
    proto: tcp
    comment: TradingChassis SSH host access
  become: true

- name: Allow inbound traffic on the Calico VXLAN interface
  community.general.ufw:
    rule: allow
    interface: vxlan.calico
    direction: in
    comment: MicroK8s Calico VXLAN inbound
  become: true

- name: Allow outbound traffic on the Calico VXLAN interface
  community.general.ufw:
    rule: allow
    interface: vxlan.calico
    direction: out
    comment: MicroK8s Calico VXLAN outbound
  become: true

- name: Allow inbound traffic on Calico virtual ethernet interfaces
  community.general.ufw:
    rule: allow
    interface: cali+
    direction: in
    comment: MicroK8s Calico veth inbound
  become: true

- name: Allow outbound traffic on Calico virtual ethernet interfaces
  community.general.ufw:
    rule: allow
    interface: cali+
    direction: out
    comment: MicroK8s Calico veth outbound
  become: true

- name: Enable UFW with the explicit MicroK8s-compatible host policy
  community.general.ufw:
    state: enabled
  become: true

- name: Install MicroK8s from the pinned snap channel
  community.general.snap:
    name: microk8s
    classic: true
    channel: "{{ microk8s_channel }}"
    state: present
  become: true

- name: Wait for MicroK8s to become ready
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --wait-ready
  become: true
  changed_when: false

- name: Check required MicroK8s addon status
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --addon
      - "{{ item }}"
  become: true
  loop: "{{ microk8s_addons }}"
  register: microk8s_addon_checks
  changed_when: false
  failed_when: >-
    microk8s_addon_checks.rc != 0
    or (microk8s_addon_checks.stdout | trim) not in ['enabled', 'disabled']

- name: Enable missing required MicroK8s addons
  ansible.builtin.command:
    argv:
      - microk8s
      - enable
      - "{{ item.item }}"
  become: true
  loop: "{{ microk8s_addon_checks.results }}"
  when: (item.stdout | trim) == 'disabled'
  changed_when: true

- name: Wait for MicroK8s readiness after addon convergence
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --wait-ready
  become: true
  changed_when: false
