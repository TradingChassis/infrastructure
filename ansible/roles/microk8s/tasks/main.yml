---
- name: Ensure snapd is installed
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure UFW package is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure snapd service is enabled and started
  ansible.builtin.service:
    name: snapd
    state: started
    enabled: true
  become: true

# OCI Ubuntu cloud images persist an unconditional IPv4 FORWARD REJECT and
# an INPUT catch-all REJECT in /etc/iptables/rules.v4. Those rules are the
# CLOUD_IMG nft-compatible baseline. FORWARD REJECT is removed. INPUT REJECT
# is retained, with narrow MicroK8s pod → node-local API and kubelet allows
# inserted immediately before it. Persist the contract, enable UFW, then
# reconcile nft runtime from the same helper used at boot. UFW boot init
# does not reload rules.v4; the oneshot below does.
- name: Assert MicroK8s pod CIDR and host TCP ports are present
  ansible.builtin.assert:
    that:
      - (microk8s_pod_cidr | trim | length) > 0
      - (microk8s_apiserver_port | trim | length) > 0
      - (microk8s_kubelet_port | trim | length) > 0
      - (microk8s_apiserver_port | trim) != (microk8s_kubelet_port | trim)
    fail_msg: >-
      microk8s_pod_cidr, microk8s_apiserver_port, and
      microk8s_kubelet_port must be set and the two ports must differ.
      The supported contract is the MicroK8s 1.29/stable Calico pod CIDR
      plus kube-apiserver and kubelet ports, not a live Pod, Service, or
      node address.
    success_msg: MicroK8s pod CIDR and host TCP ports are present.

- name: Ensure TradingChassis firewall helper directory exists
  ansible.builtin.file:
    path: "{{ microk8s_firewall_helper_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install OCI MicroK8s firewall normalization helper
  ansible.builtin.copy:
    src: normalize_oci_microk8s_firewall.py
    dest: "{{ microk8s_firewall_helper_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Normalize persistent OCI cloud-image IPv4 firewall for MicroK8s
  ansible.builtin.command:
    argv:
      - "{{ microk8s_python_interpreter }}"
      - "{{ microk8s_firewall_helper_path }}"
      - --rules-file
      - "{{ microk8s_firewall_rules_file }}"
      - --pod-cidr
      - "{{ microk8s_pod_cidr | trim }}"
      - --apiserver-port
      - "{{ microk8s_apiserver_port | trim }}"
      - --kubelet-port
      - "{{ microk8s_kubelet_port | trim }}"
  register: microk8s_oci_firewall_file
  become: true
  changed_when: (microk8s_oci_firewall_file.stdout | trim) == "changed"
  failed_when: microk8s_oci_firewall_file.rc != 0

- name: Stat iptables-nft for runtime firewall reconciliation
  ansible.builtin.stat:
    path: "{{ microk8s_iptables_nft }}"
  register: microk8s_iptables_nft_stat

- name: Assert iptables-nft is present for runtime firewall reconciliation
  ansible.builtin.assert:
    that:
      - microk8s_iptables_nft_stat.stat.exists
    fail_msg: >-
      /usr/sbin/iptables-nft is required to reconcile the OCI cloud-image
      nft-compatible filter table. The supported Ubuntu 24 OCI reference
      host provides iptables-nft. iptables-legacy Kubernetes rules are not modified.
    success_msg: iptables-nft is present for semantic nft filter reconciliation.

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true

- name: Set UFW default routed policy to allow for MicroK8s CNI
  community.general.ufw:
    direction: routed
    policy: allow
  become: true

- name: Allow SSH on the host firewall
  community.general.ufw:
    rule: allow
    port: "{{ microk8s_firewall_ssh_port }}"
    proto: tcp
    comment: TradingChassis SSH host access
  become: true

- name: Allow inbound traffic on the Calico VXLAN interface
  community.general.ufw:
    rule: allow
    interface: vxlan.calico
    direction: in
    comment: MicroK8s Calico VXLAN inbound
  become: true

- name: Allow outbound traffic on the Calico VXLAN interface
  community.general.ufw:
    rule: allow
    interface: vxlan.calico
    direction: out
    comment: MicroK8s Calico VXLAN outbound
  become: true

- name: Allow inbound traffic on Calico virtual ethernet interfaces
  community.general.ufw:
    rule: allow
    interface: cali+
    direction: in
    comment: MicroK8s Calico veth inbound
  become: true

- name: Allow outbound traffic on Calico virtual ethernet interfaces
  community.general.ufw:
    rule: allow
    interface: cali+
    direction: out
    comment: MicroK8s Calico veth outbound
  become: true

- name: Enable UFW with the explicit MicroK8s-compatible host policy
  community.general.ufw:
    state: enabled
  become: true

# Reconcile nft runtime after UFW has installed its chains. The helper uses
# /usr/sbin/iptables-nft only, never flushes tables, and never restores a
# whole table. The same command is ExecStart of the boot oneshot.
- name: Reconcile nft-compatible OCI MicroK8s firewall runtime
  ansible.builtin.command:
    argv:
      - "{{ microk8s_python_interpreter }}"
      - "{{ microk8s_firewall_helper_path }}"
      - --apply-runtime
      - --rules-file
      - "{{ microk8s_firewall_rules_file }}"
      - --pod-cidr
      - "{{ microk8s_pod_cidr | trim }}"
      - --apiserver-port
      - "{{ microk8s_apiserver_port | trim }}"
      - --kubelet-port
      - "{{ microk8s_kubelet_port | trim }}"
  register: microk8s_oci_firewall_runtime
  become: true
  changed_when: (microk8s_oci_firewall_runtime.stdout | trim) == "changed"
  failed_when: microk8s_oci_firewall_runtime.rc != 0

- name: Install OCI MicroK8s firewall boot reconciliation unit
  ansible.builtin.template:
    src: tradingchassis-oci-microk8s-firewall.service.j2
    dest: "/etc/systemd/system/{{ microk8s_firewall_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: microk8s_oci_firewall_unit
  notify: Reload systemd for OCI MicroK8s firewall boot unit

- name: Flush systemd reload before enabling the firewall boot unit
  ansible.builtin.meta: flush_handlers

- name: Enable OCI MicroK8s firewall boot reconciliation unit
  ansible.builtin.systemd_service:
    name: "{{ microk8s_firewall_unit_name }}"
    enabled: true
  become: true
  register: microk8s_oci_firewall_unit_enable

- name: Install MicroK8s from the pinned snap channel
  community.general.snap:
    name: microk8s
    classic: true
    channel: "{{ microk8s_channel }}"
    state: present
  become: true

- name: Wait for MicroK8s to become ready
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --wait-ready
  become: true
  changed_when: false

- name: Check required MicroK8s addon status
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --addon
      - "{{ item }}"
  become: true
  loop: "{{ microk8s_addons }}"
  register: microk8s_addon_checks
  changed_when: false
  failed_when: >-
    microk8s_addon_checks.rc != 0
    or (microk8s_addon_checks.stdout | trim) not in ['enabled', 'disabled']

- name: Enable missing required MicroK8s addons
  ansible.builtin.command:
    argv:
      - microk8s
      - enable
      - "{{ item.item }}"
  become: true
  loop: "{{ microk8s_addon_checks.results }}"
  when: (item.stdout | trim) == 'disabled'
  changed_when: true

- name: Wait for MicroK8s readiness after addon convergence
  ansible.builtin.command:
    argv:
      - microk8s
      - status
      - --wait-ready
  become: true
  changed_when: false
