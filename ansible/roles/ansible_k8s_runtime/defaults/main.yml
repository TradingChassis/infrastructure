---
# Dedicated remote Python runtime for kubernetes.core modules only.
# Not a general application runtime. Not owned by Argo CD.
# Host roles continue to use /usr/bin/python3 (python3-apt, UFW, snap).
ansible_k8s_runtime_parent: /opt/tradingchassis
ansible_k8s_runtime_venv: /opt/tradingchassis/ansible-kubernetes
ansible_k8s_runtime_python: "{{ ansible_k8s_runtime_venv }}/bin/python3"

# python3-venv provides stdlib venv + ensurepip for /usr/bin/python3.
# Do not apt-install system python3-pip. Kubernetes packages belong in the
# dedicated venv, not system Python, and must not use --break-system-packages.
ansible_k8s_runtime_apt_packages:
  - python3-venv

# kubernetes.core 6.5.0 requires kubernetes >= 24.2.0, PyYAML, and jsonpatch.
# Pin kubernetes 29.0.0 to the MicroK8s 1.29 API line without chasing latest.
ansible_k8s_runtime_min_kubernetes_version: "24.2.0"

# Repository files/requirements.txt is the source of truth on the control node.
# ansible.builtin.pip runs on the managed node, so copy the pin file there
# first. Keep it outside the venv directory Python may recreate.
ansible_k8s_runtime_requirements_dir: /opt/tradingchassis/ansible-k8s-runtime
ansible_k8s_runtime_requirements_path: "{{ ansible_k8s_runtime_requirements_dir }}/requirements.txt"
