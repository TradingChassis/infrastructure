---
# Non-live example inventory for static validation and operator handoff shape only.
# Do not use this file as production inventory.
# Do not commit real IPs, usernames bound to live hosts, or private keys.
#
# 192.0.2.10 is a documentation address from RFC 5737 TEST-NET-1.
#
# Terraform → Ansible handoff (operator-local inventory; see docs/V2_CLEAN_ROOM_DEPLOYMENT.md):
#   terraform output instance_public_ip  → ansible_host
#   operator-supplied SSH username       → ansible_user
#   terraform output scratch_volume_device → pass as -e scratch_storage_device_path
#
# SSH private keys stay in the operator agent or a local path outside Git.
all:
  children:
    tradingchassis:
      hosts:
        reference-node:
          ansible_host: 192.0.2.10
          # Operator-supplied. Confirm against the Ubuntu image in your tenancy.
          # Common for Canonical Ubuntu OCI images: ubuntu
          ansible_user: ubuntu
