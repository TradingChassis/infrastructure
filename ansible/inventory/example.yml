---
# Non-live example inventory for static validation and operator handoff shape only.
# Do not use this file as production inventory.
# Do not commit real IPs, usernames bound to live hosts, or private keys.
#
# 192.0.2.10 is a documentation address from RFC 5737 TEST-NET-1.
#
# After terraform apply, prefer:
#   ./tools/render-ansible-inventory
# which writes the ignored ansible/inventory/local.yml.
#
# Terraform → Ansible handoff:
#   terraform output instance_public_ip  → ansible_host
#   ubuntu (Ubuntu 24.04 image contract) → ansible_user
#   ~/.ssh/tradingchassis                → ansible_ssh_private_key_file
#
# Scratch device identification is fail-closed Ansible auto-discovery on the
# host. Do not pass terraform output scratch_volume_device; that field is not
# a usable Linux path for paravirtualized OCI attachments.
#
# Optional explicit override only when intentionally justified:
#   -e scratch_storage_device_path=/operator-verified/path
#
# SSH private keys stay outside Git.
all:
  children:
    tradingchassis:
      hosts:
        reference-node:
          ansible_host: 192.0.2.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/tradingchassis
