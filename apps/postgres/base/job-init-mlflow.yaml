apiVersion: batch/v1
kind: Job
metadata:
  name: init-mlflow-postgres
  namespace: postgres
spec:
  # Fresh-cluster bootstrap may create this Job before Ansible materializes the
  # SecretProviderClass and before the CSI driver syncs postgres-secret.
  # Temporary mount/config failures must retry within a bounded window instead
  # of permanently failing after a handful of attempts.
  backoffLimit: 30
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: postgres:14

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: MLFLOW_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MLFLOW_DB

            - name: MLFLOW_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MLFLOW_USER

            - name: MLFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MLFLOW_PASSWORD

          volumeMounts:
            # Mount the SPC so this Job can trigger secretObjects sync itself.
            # Without this mount the Job depends on another Pod having already
            # created postgres-secret and can permanently fail during bootstrap.
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true

          command:
            - sh
            - -c
            - |
              set -eu

              echo "Waiting for PostgreSQL to accept connections..."
              max_attempts=180
              attempt=0
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "PostgreSQL did not become ready within the bounded wait" >&2
                  exit 1
                fi
                sleep 2
              done

              echo "Creating MLflow role if not exists..."
              psql -h postgres -U "$POSTGRES_USER" -d postgres <<EOF
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = '${MLFLOW_USER}'
                ) THEN
                  CREATE ROLE ${MLFLOW_USER}
                    LOGIN PASSWORD '${MLFLOW_PASSWORD}';
                END IF;
              END
              \$\$;
              EOF

              echo "Creating MLflow database if not exists..."
              psql -h postgres -U "$POSTGRES_USER" -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '${MLFLOW_DB}'" | grep -q 1 || \
                createdb -h postgres -U "$POSTGRES_USER" "${MLFLOW_DB}"

              echo "Setting ownership and privileges..."
              psql -h postgres -U "$POSTGRES_USER" -d postgres <<EOF
              ALTER DATABASE ${MLFLOW_DB} OWNER TO ${MLFLOW_USER};
              GRANT ALL PRIVILEGES ON DATABASE ${MLFLOW_DB} TO ${MLFLOW_USER};
              EOF

              echo "MLflow database initialization complete"

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postgres-secret-bundle
