---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tradingchassis-scratch
  labels:
    app.kubernetes.io/name: tradingchassis-scratch
    app.kubernetes.io/part-of: tradingchassis
    app.kubernetes.io/component: scratch-storage
# Static binding only. No dynamic provisioner.
# Backing store is the Ansible-mounted OCI scratch filesystem at /mnt/scratch.
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
