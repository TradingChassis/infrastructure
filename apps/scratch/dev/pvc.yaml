---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      # Symmetric share of the single OCI-backed /mnt/scratch filesystem.
      # Capacity is Kubernetes accounting metadata, not a filesystem quota.
      storage: 70Gi
  storageClassName: tradingchassis-scratch
  volumeName: scratch-dev-pv
