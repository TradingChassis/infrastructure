apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # After oci-secrets platform Application (wave -1). Ordering of Application
    # CRs only; not a health dependency. See argocd/README.md.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/TradingChassis/infrastructure
    targetRevision: main
    path: apps/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack Prometheus Operator CRDs exceed the 262144-byte
      # last-applied-configuration annotation used by client-side apply.
      # Application-level Server-Side Apply avoids that annotation without
      # Replace/Force. Do not set ClientSideApplyMigration=false on Argo CD
      # v3.0.23; that option is not part of this pin.
      - ServerSideApply=true
