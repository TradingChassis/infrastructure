---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Child Applications only. root-app.yaml is applied by Ansible bootstrap and must
# not be included here, otherwise the root Application would manage itself.
resources:
  - postgres-app.yaml
  - mlflow-app.yaml
  - monitoring-app.yaml
  - argo-app.yaml
  - scratch-app-dev.yaml
  - scratch-app-prod.yaml
