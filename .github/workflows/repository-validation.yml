              sys.exit(1)
          job = jobs[0]
          backoff = job.get("spec", {}).get("backoffLimit")
          deadline = job.get("spec", {}).get("activeDeadlineSeconds")
          if not isinstance(backoff, int) or backoff < 20:
              print(
                  f"FAIL: init-mlflow-postgres backoffLimit must be >= 20 for "
