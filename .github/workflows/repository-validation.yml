# Static repository validation only.
# Does not provision, configure, or mutate infrastructure.
name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Static repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner tooling
        run: |
          set -euo pipefail
          bash --version
          python3 --version
          shellcheck --version

      - name: Check agent safety
        run: ./tools/check-agent-safety

      - name: Run agent safety unit tests
        run: ./tests/unit/test_agent_safety.sh

      - name: Run safe repository validation
        run: ./tools/validate-safe

      - name: Run ShellCheck on tracked shell files
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- '*.sh')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked *.sh files found; ShellCheck step succeeds."
            exit 0
          fi

          echo "Running ShellCheck on ${#files[@]} tracked shell file(s):"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        # Non-secret placeholders for configuration validation only.
        # Values are documentation/examples and must not be treated as real tenancy data.
        # Does not authenticate to OCI and does not provision resources.
        env:
          TF_VAR_oci_region: eu-frankfurt-1
          TF_VAR_oci_compartment_id: ocid1.compartment.oc1..example
          TF_VAR_oci_tenancy_id: ocid1.tenancy.oc1..example
          TF_VAR_oci_vault_id: ocid1.vault.oc1..example
          TF_VAR_oci_vault_compartment_id: ocid1.compartment.oc1..vault-example
          TF_VAR_ssh_ingress_cidr: 203.0.113.0/24
          # Synthetic public key for static validation only. Not a real identity.
          TF_VAR_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ci-validate-only@example.invalid
        run: terraform validate

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible validation tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "ansible-core==2.21.2" \
            "ansible-lint==26.6.0"

      - name: Show Ansible tooling versions
        run: |
          set -euo pipefail
          ansible --version
          ansible-lint --version

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-lint ansible/

      - name: Ansible playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/example.yml \
            ansible/playbooks/site.yml

  gitops:
    name: GitOps validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d55ab5a266d6b78f609ad79a35655912 # v2.1.0

      - name: Validate Argo CD Kustomization
        run: |
          set -euo pipefail
          kustomize build argocd/ > /tmp/argocd-rendered.yaml
          echo "Kustomize build succeeded."
          # Verify expected Application resources are present
          grep -q 'name: oci-secrets' /tmp/argocd-rendered.yaml
          echo "OCI secrets Application present."

      - name: Verify OCI secrets provider image pinning
        run: |
          set -euo pipefail
          APP_FILE="argocd/oci-secrets-app.yaml"
          # Must contain the immutable git-SHA image tag
          grep -q '1f9ef4b6e123c2914edf842d77483d7ee174bf0a' "$APP_FILE"
          echo "PASS: Provider image pinned by immutable git SHA tag."
          # Must not contain mutable references
          if grep -qE 'tag:\s*(latest|main)' "$APP_FILE"; then
            echo "FAIL: Mutable image tag detected."
            exit 1
          fi
          echo "PASS: No mutable image tags."

      - name: Verify MicroK8s kubelet root directory
        run: |
          set -euo pipefail
          grep -q '/var/snap/microk8s/common/var/lib/kubelet' argocd/oci-secrets-app.yaml
          echo "PASS: MicroK8s kubelet root directory configured."

      - name: Verify CSI driver dependency version
        run: |
          set -euo pipefail
          # The Application targets Oracle chart v0.5.0 which vendors CSI driver 1.3.3
          grep -q 'targetRevision: v0.5.0' argocd/oci-secrets-app.yaml
          echo "PASS: Chart pinned to v0.5.0 (CSI driver 1.3.3 dependency)."
