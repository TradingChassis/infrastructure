# Static repository validation only.
# Does not provision, configure, or mutate infrastructure.
name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Static repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner tooling
        run: |
          set -euo pipefail
          bash --version
          python3 --version
          shellcheck --version

      - name: Check agent safety
        run: ./tools/check-agent-safety

      - name: Run agent safety unit tests
        run: ./tests/unit/test_agent_safety.sh

      - name: Run safe repository validation
        run: ./tools/validate-safe

      - name: Run ShellCheck on tracked shell files
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- '*.sh')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked *.sh files found; ShellCheck step succeeds."
            exit 0
          fi

          echo "Running ShellCheck on ${#files[@]} tracked shell file(s):"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        # Non-secret placeholders for configuration validation only.
        # Values are documentation/examples and must not be treated as real tenancy data.
        # Does not authenticate to OCI and does not provision resources.
        env:
          TF_VAR_oci_region: eu-frankfurt-1
          TF_VAR_oci_compartment_id: ocid1.compartment.oc1..example
          TF_VAR_oci_tenancy_id: ocid1.tenancy.oc1..example
          TF_VAR_oci_vault_id: ocid1.vault.oc1..example
          TF_VAR_oci_vault_compartment_id: ocid1.compartment.oc1..vault-example
          TF_VAR_ssh_ingress_cidr: 203.0.113.0/24
          # Synthetic public key for static validation only. Not a real identity.
          TF_VAR_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ci-validate-only@example.invalid
        run: terraform validate

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible validation tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "ansible-core==2.21.2" \
            "ansible-lint==26.6.0"

      - name: Show Ansible tooling versions
        run: |
          set -euo pipefail
          ansible --version
          ansible-lint --version

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-lint ansible/

      - name: Ansible playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/example.yml \
            ansible/playbooks/site.yml

          # Synthetic CI-only values. Not real tenancy data and not usable live.
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/example.yml \
            -e private_runtime_config_vault_id=ocid1.vault.oc1.eu-test-1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e private_runtime_config_oci_region=eu-test-1 \
            ansible/playbooks/private-runtime-config.yml

      - name: Validate private runtime configuration contracts
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          import yaml

          root = Path(".")
          defaults_path = root / "ansible/roles/private_runtime_config/defaults/main.yml"
          template_path = (
              root
              / "ansible/roles/private_runtime_config/templates/secret-provider-class.yaml.j2"
          )
          mlflow_v2_patch = (
              root / "apps/mlflow/overlays/v2/aws-default-region-patch.yaml"
          )
          v1_spc_paths = {
              "postgres-secret-bundle": root
              / "apps/postgres/overlays/v1/secrets.yaml",
              "mlflow-secret-bundle": root / "apps/mlflow/overlays/v1/secrets.yaml",
              "monitoring-secret-bundle": root
              / "apps/monitoring/overlays/v1/secrets.yaml",
          }

          defaults = yaml.safe_load(defaults_path.read_text(encoding="utf-8"))
          spcs = defaults.get("private_runtime_config_secret_provider_classes") or []
          if len(spcs) != 3:
              print(f"FAIL: expected exactly 3 SPC contracts, found {len(spcs)}")
              sys.exit(1)

          by_name = {spc["name"]: spc for spc in spcs}
          expected_names = set(v1_spc_paths)
          if set(by_name) != expected_names:
              print(f"FAIL: SPC names {sorted(by_name)} != {sorted(expected_names)}")
              sys.exit(1)

          template = template_path.read_text(encoding="utf-8")
          if "authType: instance" not in template:
              print("FAIL: SPC template must preserve authType: instance")
              sys.exit(1)
          if 'vaultId: "{{ private_runtime_config_vault_id }}"' not in template:
              print("FAIL: SPC template must render vaultId from private_runtime_config_vault_id")
              sys.exit(1)
          if "${VAULT_ID}" in template:
              print("FAIL: SPC template must not keep the V1 ${VAULT_ID} placeholder")
              sys.exit(1)

          def normalize_secret_objects(objects):
              normalized = []
              for obj in objects:
                  data = [
                      {
                          "objectName": str(entry["objectName"]),
                          "key": str(entry["key"]),
                      }
                      for entry in obj.get("data", [])
                  ]
                  normalized.append(
                      {
                          "secretName": str(obj["secretName"]),
                          "type": str(obj.get("type", "Opaque")),
                          "data": data,
                      }
                  )
              return normalized

          def normalize_secrets_list(raw_secrets):
              if isinstance(raw_secrets, str):
                  parsed = yaml.safe_load(raw_secrets) or []
              else:
                  parsed = raw_secrets or []
              return [
                  {
                      "name": str(item["name"]),
                      "fileName": str(item["fileName"]),
                  }
                  for item in parsed
              ]

          for name, path in v1_spc_paths.items():
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              role_spc = by_name[name]
              if doc.get("kind") != "SecretProviderClass":
                  print(f"FAIL: {path} is not a SecretProviderClass")
                  sys.exit(1)
              if doc["metadata"]["name"] != name:
                  print(f"FAIL: {path} metadata.name mismatch")
                  sys.exit(1)
              if doc["metadata"]["namespace"] != role_spc["namespace"]:
                  print(
                      f"FAIL: {name} namespace drift: "
                      f"V1={doc['metadata']['namespace']} role={role_spc['namespace']}"
                  )
                  sys.exit(1)
              if doc["spec"].get("provider") != "oci":
                  print(f"FAIL: {name} provider must remain oci")
                  sys.exit(1)
              if doc["spec"]["parameters"].get("authType") != "instance":
                  print(f"FAIL: {name} authType must remain instance")
                  sys.exit(1)
              if doc["spec"]["parameters"].get("vaultId") != "${{ '${VAULT_ID}' }}":
                  print(
                      f"FAIL: active V1 {name} must keep vaultId placeholder "
                      f"${{ '${VAULT_ID}' }}"
                  )
                  sys.exit(1)

              v1_secrets = normalize_secrets_list(doc["spec"]["parameters"].get("secrets"))
              role_secrets = normalize_secrets_list(role_spc.get("secrets"))
              if v1_secrets != role_secrets:
                  print(f"FAIL: {name} secrets mapping drift between V1 and role defaults")
                  print(f"  V1={v1_secrets}")
                  print(f"  role={role_secrets}")
                  sys.exit(1)

              v1_objects = normalize_secret_objects(doc["spec"].get("secretObjects") or [])
              role_objects = normalize_secret_objects(role_spc.get("secret_objects") or [])
              if v1_objects != role_objects:
                  print(f"FAIL: {name} secretObjects drift between V1 and role defaults")
                  print(f"  V1={v1_objects}")
                  print(f"  role={role_objects}")
                  sys.exit(1)

              print(f"PASS: {name} matches V1 functional SPC contract (vaultId source excluded).")

          if defaults.get("private_runtime_config_secret_name") != "tradingchassis-runtime-config":
              print("FAIL: runtime Secret name must be tradingchassis-runtime-config")
              sys.exit(1)
          if defaults.get("private_runtime_config_secret_namespace") != "mlflow":
              print("FAIL: runtime Secret namespace must be mlflow")
              sys.exit(1)
          if defaults.get("private_runtime_config_secret_key") != "OCI_REGION":
              print("FAIL: runtime Secret key must be OCI_REGION")
              sys.exit(1)

          patch = yaml.safe_load(mlflow_v2_patch.read_text(encoding="utf-8"))
          if patch.get("metadata", {}).get("namespace") != "mlflow":
              print("FAIL: MLflow V2 patch namespace must be mlflow")
              sys.exit(1)
          containers = (
              patch.get("spec", {})
              .get("template", {})
              .get("spec", {})
              .get("containers", [])
          )
          mlflow_containers = [c for c in containers if c.get("name") == "mlflow"]
          if len(mlflow_containers) != 1:
              print("FAIL: MLflow V2 patch must target the mlflow container")
              sys.exit(1)
          region_env = [
              e
              for e in (mlflow_containers[0].get("env") or [])
              if e.get("name") == "AWS_DEFAULT_REGION"
          ]
          if len(region_env) != 1:
              print("FAIL: MLflow V2 patch must define AWS_DEFAULT_REGION once")
              sys.exit(1)
          ref = region_env[0].get("valueFrom", {}).get("secretKeyRef", {})
          if ref.get("name") != defaults["private_runtime_config_secret_name"]:
              print(
                  "FAIL: MLflow V2 secretKeyRef.name drift vs Ansible runtime Secret name"
              )
              sys.exit(1)
          if ref.get("key") != defaults["private_runtime_config_secret_key"]:
              print(
                  "FAIL: MLflow V2 secretKeyRef.key drift vs Ansible runtime Secret key"
              )
              sys.exit(1)

          site = (root / "ansible/playbooks/site.yml").read_text(encoding="utf-8")
          if "private_runtime_config" in site:
              print("FAIL: site.yml must not activate private_runtime_config yet")
              sys.exit(1)

          for shim in (
              "apps/postgres/kustomization.yaml",
              "apps/mlflow/kustomization.yaml",
              "apps/monitoring/kustomization.yaml",
          ):
              text = (root / shim).read_text(encoding="utf-8")
              if "overlays/v2" not in text:
                  print(f"FAIL: {shim} must select overlays/v2")
                  sys.exit(1)
              if re.search(r"(?m)^\s*-\s+overlays/v1\s*$", text):
                  print(f"FAIL: {shim} must not keep overlays/v1 as the active resource")
                  sys.exit(1)

          tasks_path = root / "ansible/roles/private_runtime_config/tasks/main.yml"
          tasks_text = tasks_path.read_text(encoding="utf-8")
          if re.search(r"(?m)^\s*-\s+ansible\.builtin\.(pause|wait_for)\b", tasks_text):
              print("FAIL: private_runtime_config must not use pause/wait_for sleep ordering")
              sys.exit(1)
          if re.search(r"(?m)^\s*sleep\b", tasks_text):
              print("FAIL: private_runtime_config must not use shell sleep ordering")
              sys.exit(1)

          mutate_markers = (
              "Materialize MLflow runtime configuration Secret",
              "Materialize SecretProviderClass resources",
          )
          mutate_indexes = [tasks_text.find(marker) for marker in mutate_markers]
          if any(idx < 0 for idx in mutate_indexes):
              print("FAIL: private_runtime_config mutation task names missing")
              sys.exit(1)
          first_mutate = min(mutate_indexes)

          readiness_markers = (
              "Wait for SecretProviderClass CustomResourceDefinition",
              "Wait for Secrets Store CSIDriver object",
              "Wait for Secrets Store CSI Driver DaemonSet readiness",
              "Wait for OCI Secrets Store CSI Provider DaemonSet readiness",
              "Wait for required application namespaces",
          )
          for marker in readiness_markers:
              idx = tasks_text.find(marker)
              if idx < 0:
                  print(f"FAIL: missing readiness task: {marker}")
                  sys.exit(1)
              if idx > first_mutate:
                  print(f"FAIL: readiness task must precede mutation: {marker}")
                  sys.exit(1)

          for marker in readiness_markers:
              block_start = tasks_text.find(marker)
              block_end = tasks_text.find("- name:", block_start + 1)
              if block_end < 0:
                  block_end = first_mutate
              block = tasks_text[block_start:block_end]
              if "until:" not in block:
                  print(f"FAIL: readiness task missing until: {marker}")
                  sys.exit(1)
              if "retries:" not in block:
                  print(f"FAIL: readiness task missing retries: {marker}")
                  sys.exit(1)
              if "delay:" not in block:
                  print(f"FAIL: readiness task missing delay: {marker}")
                  sys.exit(1)

          expected_defaults = {
              "private_runtime_config_spc_crd_name": (
                  "secretproviderclasses.secrets-store.csi.x-k8s.io"
              ),
              "private_runtime_config_platform_namespace": "kube-system",
              "private_runtime_config_csi_driver_name": "secrets-store.csi.k8s.io",
              "private_runtime_config_csi_driver_daemonset_name": (
                  "oci-secrets-secrets-store-csi-driver"
              ),
              "private_runtime_config_oci_provider_daemonset_name": (
                  "oci-secrets-store-csi-driver-provider"
              ),
          }
          for key, expected in expected_defaults.items():
              if defaults.get(key) != expected:
                  print(f"FAIL: {key}={defaults.get(key)!r}, expected {expected!r}")
                  sys.exit(1)

          retries = defaults.get("private_runtime_config_readiness_retries")
          delay = defaults.get("private_runtime_config_readiness_delay_seconds")
          if not isinstance(retries, int) or retries < 1:
              print("FAIL: private_runtime_config_readiness_retries must be a positive int")
              sys.exit(1)
          if not isinstance(delay, int) or delay < 1:
              print(
                  "FAIL: private_runtime_config_readiness_delay_seconds must be a positive int"
              )
              sys.exit(1)

          print("PASS: private runtime configuration contracts are consistent.")
          PY

  gitops:
    name: GitOps validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install GitOps validation tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with:
          kustomize-version: "5.8.1"

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.18.4"

      - name: Validate Argo CD Kustomization
        run: |
          set -euo pipefail
          kustomize version
          kustomize build argocd/ > /tmp/argocd-rendered.yaml
          echo "Kustomize build succeeded."
          grep -q 'name: oci-secrets' /tmp/argocd-rendered.yaml
          echo "OCI secrets Application present."
          grep -q 'name: scratch-storage' /tmp/argocd-rendered.yaml
          echo "Scratch storage Application present."

      - name: Validate scratch storage binding contract
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          def load_docs(text: str):
              return [d for d in yaml.safe_load_all(text) if isinstance(d, dict)]

          def build(path: str):
              proc = subprocess.run(
                  ["kustomize", "build", path],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return load_docs(proc.stdout)

          platform = build("apps/scratch/platform")
          dev = build("apps/scratch/dev")
          prod = build("apps/scratch/prod")
          postgres = build("apps/postgres")

          scs = [d for d in platform if d.get("kind") == "StorageClass"]
          pvs = [d for d in platform if d.get("kind") == "PersistentVolume"]
          if len(scs) != 1 or scs[0]["metadata"]["name"] != "tradingchassis-scratch":
              print(f"FAIL: expected one StorageClass tradingchassis-scratch, found {scs!r}")
              sys.exit(1)
          if scs[0].get("provisioner") != "kubernetes.io/no-provisioner":
              print("FAIL: StorageClass must use kubernetes.io/no-provisioner")
              sys.exit(1)
          if scs[0].get("reclaimPolicy") != "Retain":
              print("FAIL: StorageClass reclaimPolicy must be Retain")
              sys.exit(1)

          if len(pvs) != 2:
              print(f"FAIL: expected two PersistentVolumes, found {len(pvs)}")
              sys.exit(1)

          by_name = {d["metadata"]["name"]: d for d in pvs}
          expected = {
              "scratch-dev-pv": {
                  "ns": "dev",
                  "path": "/mnt/scratch/dev",
                  "claim": "scratch-pvc",
              },
              "scratch-prod-pv": {
                  "ns": "prod",
                  "path": "/mnt/scratch/prod",
                  "claim": "scratch-pvc",
              },
          }
          total_gi = 0
          for name, exp in expected.items():
              pv = by_name.get(name)
              if pv is None:
                  print(f"FAIL: missing PersistentVolume {name}")
                  sys.exit(1)
              if pv["spec"].get("storageClassName") != "tradingchassis-scratch":
                  print(f"FAIL: {name} storageClassName mismatch")
                  sys.exit(1)
              if pv["spec"].get("persistentVolumeReclaimPolicy") != "Retain":
                  print(f"FAIL: {name} reclaimPolicy must be Retain")
                  sys.exit(1)
              host_path = pv["spec"].get("hostPath", {})
              if host_path.get("path") != exp["path"]:
                  print(f"FAIL: {name} path={host_path.get('path')!r}, expected {exp['path']!r}")
                  sys.exit(1)
              if host_path.get("type") != "Directory":
                  print(f"FAIL: {name} hostPath.type must be Directory (fail-closed)")
                  sys.exit(1)
              claim = pv["spec"].get("claimRef", {})
              if claim.get("namespace") != exp["ns"] or claim.get("name") != exp["claim"]:
                  print(f"FAIL: {name} claimRef mismatch: {claim!r}")
                  sys.exit(1)
              cap = pv["spec"]["capacity"]["storage"]
              if not str(cap).endswith("Gi"):
                  print(f"FAIL: {name} capacity must use Gi units, got {cap!r}")
                  sys.exit(1)
              total_gi += int(str(cap)[:-2])

          # Capacity contract (accounting only; not a filesystem quota):
          # OCI Block Volume size_in_gbs uses OCI's GB convention for block-volume
          # sizing (1 GB = 1024 MiB increments / GiB-equivalent). Default is 150.
          # Kubernetes advertises 70Gi + 70Gi = 140Gi aggregate PV capacity, leaving
          # nominal headroom before filesystem overhead/reserved blocks.
          if total_gi > 140:
              print(
                  f"FAIL: PV capacities sum to {total_gi}Gi; "
                  "aggregate accounting must stay <= 140Gi against the default "
                  "OCI size_in_gbs=150 (GiB-equivalent) scratch volume"
              )
              sys.exit(1)

          for label, docs, ns, volume_name, path in (
              ("dev", dev, "dev", "scratch-dev-pv", "/mnt/scratch/dev"),
              ("prod", prod, "prod", "scratch-prod-pv", "/mnt/scratch/prod"),
          ):
              pvcs = [d for d in docs if d.get("kind") == "PersistentVolumeClaim"]
              if len(pvcs) != 1:
                  print(f"FAIL: apps/scratch/{label} expected one PVC, found {len(pvcs)}")
                  sys.exit(1)
              pvc = pvcs[0]
              if pvc["metadata"].get("name") != "scratch-pvc":
                  print(f"FAIL: apps/scratch/{label} PVC name drift")
                  sys.exit(1)
              if pvc["metadata"].get("namespace") != ns:
                  print(f"FAIL: apps/scratch/{label} PVC namespace drift")
                  sys.exit(1)
              if pvc["spec"].get("storageClassName") != "tradingchassis-scratch":
                  print(f"FAIL: apps/scratch/{label} must use tradingchassis-scratch")
                  sys.exit(1)
              if pvc["spec"].get("volumeName") != volume_name:
                  print(f"FAIL: apps/scratch/{label} volumeName must be {volume_name}")
                  sys.exit(1)
              if pvc["spec"]["resources"]["requests"]["storage"] != by_name[volume_name]["spec"]["capacity"]["storage"]:
                  print(f"FAIL: apps/scratch/{label} PVC request must match PV capacity")
                  sys.exit(1)
              if "microk8s-hostpath" in yaml.safe_dump(pvc):
                  print(f"FAIL: apps/scratch/{label} still references microk8s-hostpath")
                  sys.exit(1)
              # Ensure app trees do not own cluster-scoped storage objects.
              if any(d.get("kind") in {"StorageClass", "PersistentVolume"} for d in docs):
                  print(f"FAIL: apps/scratch/{label} must not own cluster-scoped storage objects")
                  sys.exit(1)
              print(f"PASS: scratch-{label} PVC binds {volume_name} -> {path}")

          # Platform app is the sole owner of cluster-scoped scratch objects.
          if any(d.get("kind") == "PersistentVolumeClaim" for d in platform):
              print("FAIL: platform must not own namespaced PVCs")
              sys.exit(1)

          # PostgreSQL remains on microk8s-hostpath and must not be migrated here.
          pg_pvcs = [
              d for d in postgres
              if d.get("kind") == "PersistentVolumeClaim"
              and d.get("metadata", {}).get("name") == "postgres-pvc"
          ]
          if len(pg_pvcs) != 1:
              print(f"FAIL: expected one postgres-pvc, found {len(pg_pvcs)}")
              sys.exit(1)
          if pg_pvcs[0]["spec"].get("storageClassName") != "microk8s-hostpath":
              print("FAIL: postgres-pvc storageClassName must remain microk8s-hostpath")
              sys.exit(1)

          print("PASS: scratch storage binding contract is consistent.")
          PY

      - name: Extract OCI secrets Helm values from Application
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          app_path = Path("argocd/oci-secrets-app.yaml")
          app = yaml.safe_load(app_path.read_text(encoding="utf-8"))
          source = app["spec"]["source"]
          values = source["helm"]["valuesObject"]

          expected_revision = "v0.5.0"
          expected_repo = "ghcr.io/tradingchassis/oci-secrets-store-csi-driver-provider"
          expected_tag = "1f9ef4b6e123c2914edf842d77483d7ee174bf0a"
          expected_kubelet = "/var/snap/microk8s/common/var/lib/kubelet"
          expected_chart_path = "charts/oci-secrets-store-csi-driver-provider"
