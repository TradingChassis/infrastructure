      - name: Validate OCI secrets bootstrap ordering contract
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          def wave(doc):
              ann = (doc.get("metadata") or {}).get("annotations") or {}
              return ann.get("argocd.argoproj.io/sync-wave")

          apps = {}
          for path in sorted(Path("argocd").glob("*-app*.yaml")):
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(doc, dict) or doc.get("kind") != "Application":
                  continue
              name = doc["metadata"]["name"]
              apps[name] = {"path": str(path), "wave": wave(doc), "doc": doc}

          if "oci-secrets" not in apps:
              print("FAIL: missing oci-secrets Application")
              sys.exit(1)
          if apps["oci-secrets"]["wave"] != "-1":
              print(
                  "FAIL: oci-secrets sync-wave must be '-1', "
                  f"found {apps['oci-secrets']['wave']!r}"
              )
              sys.exit(1)

          consumers = ("postgres", "mlflow", "monitoring")
          for name in consumers:
              if name not in apps:
                  print(f"FAIL: missing Application {name}")
                  sys.exit(1)
              if apps[name]["wave"] != "1":
                  print(
                      f"FAIL: {name} sync-wave must be '1', found {apps[name]['wave']!r}"
                  )
                  sys.exit(1)

          oci_wave = int(apps["oci-secrets"]["wave"])
          for name in consumers:
              if int(apps[name]["wave"]) <= oci_wave:
                  print(
                      f"FAIL: {name} sync-wave must be later than oci-secrets "
                      f"({apps[name]['wave']} vs {apps['oci-secrets']['wave']})"
                  )
                  sys.exit(1)

          # Independent apps must not be delayed behind secret consumers without cause.
          for name in ("scratch-storage", "scratch-dev", "scratch-prod", "argo"):
              if name in apps and apps[name]["wave"] not in (None, "0"):
                  print(
                      f"FAIL: {name} should keep default/0 sync-wave, "
                      f"found {apps[name]['wave']!r}"
                  )
                  sys.exit(1)

          # Preserve ownership / sync policy contracts on ordered apps.
          for name in ("oci-secrets",) + consumers:
              doc = apps[name]["doc"]
              automated = ((doc.get("spec") or {}).get("syncPolicy") or {}).get(
                  "automated"
              ) or {}
              if automated.get("prune") is not True or automated.get("selfHeal") is not True:
                  print(f"FAIL: {name} must keep automated prune+selfHeal")
                  sys.exit(1)

          oci_opts = (
              ((apps["oci-secrets"]["doc"].get("spec") or {}).get("syncPolicy") or {}).get(
                  "syncOptions"
              )
              or []
          )
          if "CreateNamespace=false" not in oci_opts:
              print("FAIL: oci-secrets must keep CreateNamespace=false")
              sys.exit(1)
          for name in consumers:
              opts = (
                  ((apps[name]["doc"].get("spec") or {}).get("syncPolicy") or {}).get(
                      "syncOptions"
                  )
                  or []
              )
              if "CreateNamespace=true" not in opts:
                  print(f"FAIL: {name} must keep CreateNamespace=true")
                  sys.exit(1)

          rendered = Path("/tmp/argocd-rendered.yaml")
          if rendered.exists():
              docs = list(yaml.safe_load_all(rendered.read_text(encoding="utf-8")))
              by_name = {
                  d["metadata"]["name"]: d
                  for d in docs
                  if isinstance(d, dict)
                  and d.get("kind") == "Application"
                  and "metadata" in d
              }
              for name, expected_wave in (
                  ("oci-secrets", "-1"),
                  ("postgres", "1"),
                  ("mlflow", "1"),
                  ("monitoring", "1"),
              ):
                  ann = (by_name[name].get("metadata") or {}).get("annotations") or {}
                  if ann.get("argocd.argoproj.io/sync-wave") != expected_wave:
                      print(
                          f"FAIL: rendered {name} sync-wave mismatch: "
                          f"{ann.get('argocd.argoproj.io/sync-wave')!r}"
                      )
                      sys.exit(1)

          print("PASS: OCI secrets bootstrap Application ordering contract.")
          PY

      - name: Verify provider image tag resolves to expected multi-arch digest
        run: |
          set -euo pipefail
          IMAGE_REPO="tradingchassis/oci-secrets-store-csi-driver-provider"
          IMAGE_TAG="1f9ef4b6e123c2914edf842d77483d7ee174bf0a"
          EXPECTED_DIGEST="sha256:a04180e28fe6a6b55b1dea934baae174ee1e02ddbb6142157ab706dec0ca180b"

          TOKEN="$(
            curl -fsS \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_REPO}:pull" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])'
          )"

          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -D "${HEADERS}" \
            -o "${BODY}" \
            "https://ghcr.io/v2/${IMAGE_REPO}/manifests/${IMAGE_TAG}"

          ACTUAL_DIGEST="$(
            python3 - "${HEADERS}" <<'PY'
          import sys
          digest = None
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  if line.lower().startswith("docker-content-digest:"):
                      digest = line.split(":", 1)[1].strip()
                      break
          if not digest:
              raise SystemExit("FAIL: docker-content-digest header missing from GHCR response.")
          print(digest)
          PY
          )"

          if [ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "FAIL: tag ${IMAGE_TAG} resolved to ${ACTUAL_DIGEST}, expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          echo "PASS: Image tag resolves to expected digest ${EXPECTED_DIGEST}."

          python3 - "${BODY}" <<'PY'
          import json
          import sys

          body = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              (m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture"))
              for m in body.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = sorted(required - platforms)
          if missing:
              print(f"FAIL: missing platforms {missing}; found {sorted(platforms)}")
              raise SystemExit(1)
          print("PASS: Manifest includes linux/amd64 and linux/arm64.")
          PY

