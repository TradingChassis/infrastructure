# Static repository validation only.
# Does not provision, configure, or mutate infrastructure.
name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Static repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner tooling
        run: |
          set -euo pipefail
          bash --version
          python3 --version
          shellcheck --version

      - name: Check agent safety
        run: ./tools/check-agent-safety

      - name: Run agent safety unit tests
        run: ./tests/unit/test_agent_safety.sh

      - name: Run safe repository validation
        run: ./tools/validate-safe

      - name: Run ShellCheck on tracked shell files
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- '*.sh')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked *.sh files found; ShellCheck step succeeds."
            exit 0
          fi

          echo "Running ShellCheck on ${#files[@]} tracked shell file(s):"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        # Non-secret placeholders for configuration validation only.
        # Values are documentation/examples and must not be treated as real tenancy data.
        # Does not authenticate to OCI and does not provision resources.
        env:
          TF_VAR_oci_region: eu-frankfurt-1
          TF_VAR_oci_compartment_id: ocid1.compartment.oc1..example
          TF_VAR_oci_tenancy_id: ocid1.tenancy.oc1..example
          TF_VAR_oci_vault_id: ocid1.vault.oc1..example
          TF_VAR_oci_vault_compartment_id: ocid1.compartment.oc1..vault-example
          TF_VAR_ssh_ingress_cidr: 203.0.113.0/24
          # Synthetic public key for static validation only. Not a real identity.
          TF_VAR_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ci-validate-only@example.invalid
        run: terraform validate

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible validation tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "ansible-core==2.21.2" \
            "ansible-lint==26.6.0"

      - name: Show Ansible tooling versions
        run: |
          set -euo pipefail
          ansible --version
          ansible-lint --version

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-lint ansible/

      - name: Ansible playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/example.yml \
            ansible/playbooks/site.yml

  gitops:
    name: GitOps validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install GitOps validation tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with:
          kustomize-version: "5.8.1"

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.18.4"

      - name: Validate Argo CD Kustomization
        run: |
          set -euo pipefail
          kustomize version
          kustomize build argocd/ > /tmp/argocd-rendered.yaml
          echo "Kustomize build succeeded."
          grep -q 'name: oci-secrets' /tmp/argocd-rendered.yaml
          echo "OCI secrets Application present."

      - name: Extract OCI secrets Helm values from Application
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          app_path = Path("argocd/oci-secrets-app.yaml")
          app = yaml.safe_load(app_path.read_text(encoding="utf-8"))
          source = app["spec"]["source"]
          values = source["helm"]["valuesObject"]

          expected_revision = "v0.5.0"
          expected_repo = "ghcr.io/tradingchassis/oci-secrets-store-csi-driver-provider"
          expected_tag = "1f9ef4b6e123c2914edf842d77483d7ee174bf0a"
          expected_kubelet = "/var/snap/microk8s/common/var/lib/kubelet"
          expected_chart_path = "charts/oci-secrets-store-csi-driver-provider"
          expected_oracle_repo = (
              "https://github.com/oracle/oci-secrets-store-csi-driver-provider"
          )

          errors = []
          if source.get("repoURL") != expected_oracle_repo:
              errors.append(f"repoURL={source.get('repoURL')!r}")
          if source.get("targetRevision") != expected_revision:
              errors.append(f"targetRevision={source.get('targetRevision')!r}")
          if source.get("path") != expected_chart_path:
              errors.append(f"path={source.get('path')!r}")

          image = values["provider"]["image"]
          if image.get("repository") != expected_repo:
              errors.append(f"provider.image.repository={image.get('repository')!r}")
          if image.get("tag") != expected_tag:
              errors.append(f"provider.image.tag={image.get('tag')!r}")
          if image.get("tag") in {"latest", "main"}:
              errors.append("mutable provider image tag")

          csi = values["secrets-store-csi-driver"]
          if csi.get("install") is not True:
              errors.append(f"secrets-store-csi-driver.install={csi.get('install')!r}")
          kubelet = csi.get("linux", {}).get("kubeletRootDir")
          if kubelet != expected_kubelet:
              errors.append(f"kubeletRootDir={kubelet!r}")

          dest_ns = app["spec"]["destination"].get("namespace")
          if dest_ns != "kube-system":
              errors.append(f"destination.namespace={dest_ns!r}")

          if errors:
              print("FAIL: OCI secrets Application contract mismatch:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          out = Path("/tmp/oci-secrets-values.yaml")
          out.write_text(
              yaml.safe_dump(values, sort_keys=False),
              encoding="utf-8",
          )
          print("PASS: Application Helm valuesObject contract.")
          print(f"Wrote {out}")
          PY

      - name: Fetch Oracle provider chart v0.5.0 and verify CSI dependency
        run: |
          set -euo pipefail
          CHART_ROOT="/tmp/oracle-oci-secrets-provider"
          rm -rf "${CHART_ROOT}"
          git clone --depth 1 --branch v0.5.0 \
            https://github.com/oracle/oci-secrets-store-csi-driver-provider \
            "${CHART_ROOT}"
          CHART_DIR="${CHART_ROOT}/charts/oci-secrets-store-csi-driver-provider"
          test -f "${CHART_DIR}/Chart.yaml"
          test -f "${CHART_DIR}/Chart.lock"
          test -f "${CHART_DIR}/charts/secrets-store-csi-driver-1.3.3.tgz"

          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          chart_dir = Path("/tmp/oracle-oci-secrets-provider/charts/oci-secrets-store-csi-driver-provider")
          chart = yaml.safe_load((chart_dir / "Chart.yaml").read_text(encoding="utf-8"))
          lock = yaml.safe_load((chart_dir / "Chart.lock").read_text(encoding="utf-8"))

          deps = chart.get("dependencies") or []
          chart_csi = [
              d for d in deps
              if d.get("name") == "secrets-store-csi-driver"
          ]
          if len(chart_csi) != 1 or chart_csi[0].get("version") != "1.3.3":
              print(f"FAIL: Chart.yaml CSI dependency unexpected: {chart_csi!r}")
              sys.exit(1)

          lock_deps = lock.get("dependencies") or []
          lock_csi = [
              d for d in lock_deps
              if d.get("name") == "secrets-store-csi-driver"
          ]
          if len(lock_csi) != 1 or lock_csi[0].get("version") != "1.3.3":
              print(f"FAIL: Chart.lock CSI dependency unexpected: {lock_csi!r}")
              sys.exit(1)

          print("PASS: Oracle v0.5.0 pins secrets-store-csi-driver 1.3.3 in Chart.yaml and Chart.lock.")
          PY

      - name: Helm template OCI secrets chart with Application values
        run: |
          set -euo pipefail
          helm version
          CHART_DIR="/tmp/oracle-oci-secrets-provider/charts/oci-secrets-store-csi-driver-provider"
          helm template oci-secrets "${CHART_DIR}" \
            --namespace kube-system \
            --values /tmp/oci-secrets-values.yaml \
            > /tmp/oci-secrets-helm-rendered.yaml

          EXPECTED_IMAGE="ghcr.io/tradingchassis/oci-secrets-store-csi-driver-provider:1f9ef4b6e123c2914edf842d77483d7ee174bf0a"
          KUBELET_ROOT="/var/snap/microk8s/common/var/lib/kubelet"

          grep -F "image: \"${EXPECTED_IMAGE}\"" /tmp/oci-secrets-helm-rendered.yaml \
            || grep -F "image: ${EXPECTED_IMAGE}" /tmp/oci-secrets-helm-rendered.yaml
          echo "PASS: Rendered provider image is repository:tag (not digest-deployed)."

          if grep -E 'image:.*(latest|main)([[:space:]]|$|"|\x27)' /tmp/oci-secrets-helm-rendered.yaml; then
            echo "FAIL: Mutable image tag found in rendered manifests."
            exit 1
          fi

          grep -Fq "${KUBELET_ROOT}/pods" /tmp/oci-secrets-helm-rendered.yaml
          grep -Fq "${KUBELET_ROOT}/plugins/csi-secrets-store/" /tmp/oci-secrets-helm-rendered.yaml
          echo "PASS: Rendered CSI DaemonSet uses MicroK8s kubeletRootDir."

          grep -Eq 'kind:[[:space:]]*DaemonSet' /tmp/oci-secrets-helm-rendered.yaml
          grep -Fq 'name: secrets-store-csi-driver' /tmp/oci-secrets-helm-rendered.yaml \
            || grep -Fq 'app: secrets-store-csi-driver' /tmp/oci-secrets-helm-rendered.yaml \
            || grep -Fq 'secrets-store-csi-driver' /tmp/oci-secrets-helm-rendered.yaml
          echo "PASS: CSI driver resources present in Helm render."

          grep -Fq 'namespace: kube-system' /tmp/oci-secrets-helm-rendered.yaml
          echo "PASS: Rendered resources target kube-system."

      - name: Verify provider image tag resolves to expected multi-arch digest
        run: |
          set -euo pipefail
          IMAGE_REPO="tradingchassis/oci-secrets-store-csi-driver-provider"
          IMAGE_TAG="1f9ef4b6e123c2914edf842d77483d7ee174bf0a"
          EXPECTED_DIGEST="sha256:a04180e28fe6a6b55b1dea934baae174ee1e02ddbb6142157ab706dec0ca180b"

          TOKEN="$(
            curl -fsS \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_REPO}:pull" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])'
          )"

          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -D "${HEADERS}" \
            -o "${BODY}" \
            "https://ghcr.io/v2/${IMAGE_REPO}/manifests/${IMAGE_TAG}"

          ACTUAL_DIGEST="$(
            python3 - "${HEADERS}" <<'PY'
          import sys
          digest = None
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  if line.lower().startswith("docker-content-digest:"):
                      digest = line.split(":", 1)[1].strip()
                      break
          if not digest:
              raise SystemExit("FAIL: docker-content-digest header missing from GHCR response.")
          print(digest)
          PY
          )"

          if [ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "FAIL: tag ${IMAGE_TAG} resolved to ${ACTUAL_DIGEST}, expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          echo "PASS: Image tag resolves to expected digest ${EXPECTED_DIGEST}."

          python3 - "${BODY}" <<'PY'
          import json
          import sys

          body = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              (m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture"))
              for m in body.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = sorted(required - platforms)
          if missing:
              print(f"FAIL: missing platforms {missing}; found {sorted(platforms)}")
              raise SystemExit(1)
          print("PASS: Manifest includes linux/amd64 and linux/arm64.")
          PY
